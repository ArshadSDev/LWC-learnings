<template>
    <lightning-card title="Contact Base"> 
        <div class="slds-p-around_medium">
            <lightning-record-edit-form
            lwc:ref="contactForm"
            object-api-name={objectApiName}
            record-id={recordId}
            onsubmit={handleSubmitform}
            onsuccess={handleSuccessForm}
            >
                <lightning-input-field field-name={firstName}></lightning-input-field>
                <lightning-input-field field-name={lastName}></lightning-input-field>
                <lightning-input-field field-name={source} lwc:ref="sourceValue"></lightning-input-field>
                <lightning-input-field field-name={email}></lightning-input-field>
                <lightning-input-field field-name={phone}></lightning-input-field>
                <lightning-input-field field-name={accountName}></lightning-input-field>
            
                <lightning-button label="Submit" type="submit" variant="Brand" class="slds-p-around_medium"></lightning-button>
                <lightning-button label="reset" type="reset" variant="Neutral" class="slds-p-around_medium"></lightning-button>
                <lightning-button label="Cancel" onclick={handleOnClickEvent} variant="brand-outline" class="slds-p-around_medium"></lightning-button>

            
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
