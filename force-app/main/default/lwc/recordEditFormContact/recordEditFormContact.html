<template>
    
    <lightning-card title="Contact Edit form">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form
            object-api-name={objectApiName}
            record-id="003dM00001zA8v9QAC"
            onsubmit={handleSubmit}
            lwc:ref="contactForm"
            onsuccess={handleSuccess}
            >
                <lightning-input-field field-name={lastName}></lightning-input-field>
                <lightning-input-field field-name={account} lwc:ref="accountName" ></lightning-input-field>
                <lightning-input-field field-name={title} lwc:ref="titleValue"></lightning-input-field>
                <lightning-input-field field-name={description} lwc:ref="description" ></lightning-input-field>
                <lightning-input-field field-name={birthDate}></lightning-input-field>

                <lightning-button label="Save" type="submit"></lightning-button>
         </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
