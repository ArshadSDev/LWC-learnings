<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_medium">
<div class="slds-modal__container">

<div class="slds-modal__header">
<h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Child Component</h1>
</div>
<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

<c-css-binding></c-css-binding>

    <lightning-input type="checkbox" label="low" name="input1" onchange={handleCheckBoxLow}></lightning-input>
    <lightning-input type="checkbox" label="medium" name="input1" onchange={handleCheckBoxMedium}></lightning-input>
    <lightning-input type="checkbox" label="High option" name="input1" onchange={handleCheckBoxHigh}></lightning-input>

    <div>
    Stop clock:{timer}
    </div>
</div>

<div class="slds-modal__footer">

<button class="slds-button slds-button_brand" onclick={handleClickEvent}>close</button>
</div>
</div>
</section>
<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
